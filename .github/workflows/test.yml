name: test

on:
  push:
    branches: [main, "ai/*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install native engine dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Core unit tests (no Python)
        run: cargo test --no-default-features
      - name: Install Python package
        run: |
          pip install maturin pytest hypothesis ruff mypy
          pip install -e .
      - name: Python tests
        run: pytest
      - name: Coverage
        if: runner.os == 'Linux'
        run: |
          pip install pytest-cov
          pytest --cov=src/winvpwn --cov-report=term-missing --cov-fail-under=80
