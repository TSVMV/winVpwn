[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "winvpwn"
version = "0.1.0"
description = "Run Linux ELF binaries on Windows without WSL, VMs or Docker: a pwntools compatibility layer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "winVpwn contributors" }]
keywords = ["pwn", "ctf", "elf", "unicorn", "pwntools"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Emulators",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<15",
    "capstone>=5.0,<7",
    "keystone-engine>=0.9.2,<1",
]

[project.scripts]
winvpwn = "winvpwn.cli:app"

[project.urls]
Repository = "https://github.com/OWNER/winVpwn"

[tool.maturin]
manifest-path = "crates/winvpwn-core/Cargo.toml"
python-source = "src"
module-name = "winvpwn._core"
features = ["python"]
strip = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = ["build/", "dist/"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["capstone.*", "keystone.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
